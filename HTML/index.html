<!-- Oque é HTML?
// HTML é a sigla para HyperText Markup Language, que em português significa Linguagem de Marcação de Hipertexto. É a linguagem padrão usada para criar e estruturar páginas da web. O HTML é composto por uma série de elementos e tags que definem a estrutura e o conteúdo de uma página, como títulos, parágrafos, links, imagens e muito mais. Ele é interpretado pelos navegadores web para exibir o conteúdo de forma visual aos usuários. -->

<!-- HTML: Não é uma linguagem de programação, mas sim uma linguagem de marcação. Ele é usado para estruturar o conteúdo de uma página da web, mas não possui funcionalidades de lógica ou controle de fluxo como as linguagens de programação. O HTML é essencial para criar a estrutura básica de uma página, enquanto outras tecnologias, como CSS e JavaScript, são usadas para estilizar e adicionar interatividade à página. -->

<!-- O HTML serve para dizer ao navegador:
// onde existe um título
// um texto
// uma imagem
// um link
// uma lista
e muito mais... -->

<!-- Como o HTML Funciona?
O HTML usa tags. -->

<!-- exemplo:
<h1>Olá, Mundo!</h1> -->

<!-- Essa tag <h1> </h1> significa:
"Isso é um título de nível 1 ou título principal" -->

<!-- Estrutura básica de um documento HTML:
<!DOCTYPE html>
<html>
  <head>
    <title>Minha Página Web</title>
  </head>
  <body>
    <h1>Bem-vindo à minha página!</h1>
    <p>Este é um parágrafo de exemplo.</p>
  </body>
</html> -->

<!-- Explicação da estrutura:
<!DOCTYPE html>: Declaração do tipo de documento, indicando que é um documento HTML5.
<html lang="pt-br">: Elemento raiz que envolve todo o conteúdo da página.
<head>: Contém informações sobre a página, como o título e links para arquivos CSS ou JavaScript.
<title>: Define o título da página que aparece na aba do navegador.
<body>: Contém o conteúdo visível da página, como texto, imagens e links. -->

<!-- Tags mais importantes do HTML:
<h1> a <h6>: Títulos de diferentes níveis, onde <h1> é o mais importante e <h6> o menos importante.
<p>: Define um parágrafo de texto.
<a href="https://www.exemplo.com">: Define um link para outra página ou recurso.
<img src="imagem.jpg" alt="Descrição da imagem">: Insere uma imagem na página.
<ol>: Define uma lista ordenada (numerada).
<ul> e <ol>: Criam listas não ordenadas (com marcadores) e ordenadas (numeradas), respectivamente.
<li>: Define um item de lista dentro de uma <ul> ou <ol>.
<div>: Define uma divisão ou seção na página, usada para agrupar elementos e aplicar estilos.<span>: Define um trecho de texto ou um grupo de elementos inline, usado para aplicar estilos específicos.
<br>: Insere uma quebra de linha.
<hr>: Insere uma linha horizontal para separar conteúdo.
<meta>: Fornece metadados sobre o documento, como charset, descrição e palavras-chave.
<button>: Define um botão clicável.
<link>: Usado para vincular arquivos externos, como folhas de estilo CSS.
<script>: Usado para incluir código JavaScript na página. 
<input>: Define um campo de entrada para o usuário, como um campo de texto ou um botão de envio.
-->
